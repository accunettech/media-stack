networks:
  media_net:
    driver: bridge

services:
  homepage:
    image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: media-homepage
    networks: [media_net]
    ports:
      - "80:80"
    volumes:
      - ./homepage:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    networks: [media_net]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      # Pick a country (or SERVER_HOSTNAME if you want exact server)
      - SERVER_COUNTRIES=United States
      - HEALTH_SERVER_ADDRESS=0.0.0.0:9999
    ports:
      - "8080:8080"           # qBittorrent Web UI
      - "6881:6881"           # Torrent TCP
      - "6881:6881/udp"       # Torrent UDP
    volumes:
      - ${CONF_HOME}/gluetun:/gluetun
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    labels:
      deunhealth.restart.on.unhealthy: "true"

  # When running in container, initial password will be randomized. Check logs after first run
  # to get current password and then change after initial login.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
    container_name: qbittorrent
    #Shares gluetun's network namespace + firewall/kill switch
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${OWNER_UID}
      - PGID=${OWNER_GID}
      - TZ=${TZ:-America/Detroit}
      - WEBUI_PORT=8080
    volumes:
      - ${CONF_HOME}/qbittorrent:/config
      - ${DOWNLOADS_DIR}:/downloads
    healthcheck:
      test: ["CMD-SHELL", "test -d /sys/class/net/tun0 && ip route get 1.1.1.1 | grep -q 'dev tun0' && curl -fsS -o /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      deunhealth.restart.on.unhealthy: "true"
    restart: unless-stopped

  jellyfin:
    build:
      context: .
    container_name: jellyfin
    user: "${OWNER_UID}:${OWNER_GID}"
    networks: [media_net]
    environment:
      - TZ=${TZ:-America/Detroit}
    ports:
      - "8096:8096"           # HTTP
    # GPU devices/runtime are added by the ignored .hardware/compose.json.
    volumes:
      - ${CONF_HOME}/jellyfin/config:/config
      - ${CONF_HOME}/jellyfin/cache:/cache
      - ${MEDIA_DIR}:/media:rw  # set to :ro if you don't want Jellyfin to write artwork/metadata
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:889dcc58c6aea859033985894b519b2e6b1e55d92527ed123f9f52e42ae7c97b
    container_name: sonarr
    networks: [media_net]
    environment:
      - PUID=${OWNER_UID}
      - PGID=${OWNER_GID}
      - TZ=${TZ:-America/Detroit}
    ports:
      - "8989:8989"
    volumes:
      - ${CONF_HOME}/sonarr:/config
      - ${SHOWS_DIR}:/shows
      - ${DOWNLOADS_DIR}:/downloads
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1
    container_name: radarr
    networks: [media_net]
    environment:
      - PUID=${OWNER_UID}
      - PGID=${OWNER_GID}
      - TZ=${TZ:-America/Detroit}
    ports:
      - "7878:7878"
    volumes:
      - ${CONF_HOME}/radarr:/config
      - ${MOVIES_DIR}:/movies
      - ${DOWNLOADS_DIR}:/downloads
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    shm_size: "2gb"
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
      - BROWSER_TIMEOUT=120000
    networks: [media_net]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    container_name: prowlarr
    networks: [media_net]
    environment:
      - PUID=${OWNER_UID}
      - PGID=${OWNER_GID}
      - TZ=${TZ:-America/Detroit}
    ports:
      - "9696:9696"
    volumes:
      - ${CONF_HOME}/prowlarr:/config
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01
    container_name: sabnzbd
    networks: [media_net]
    environment:
      - PUID=${OWNER_UID}
      - PGID=${OWNER_GID}
      - TZ=${TZ:-America/Detroit}
    # SAB's default HTTP port is 8080; qB is already using 8080 on the host via gluetun.
    # Expose SAB on 8081 externally to avoid a clash.
    ports:
      - "8081:8080"
    volumes:
      - ${CONF_HOME}/sabnzbd:/config
      - ${DOWNLOADS_DIR}:/downloads
    healthcheck:
      test: ["CMD", "sh", "-lc", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # --- Auto-restart unhealthy containers (uses labels) ---
  deunhealth:
    image: qmcgaw/deunhealth:latest@sha256:db1e4fcd3aceeb0da34a83f7a8a5432df586e6d0388ddb6ad8dd7b479e4aa25d
    container_name: deunhealth
    restart: unless-stopped
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # --- VPN watchdog to alert if VPN goes down  ---
  vpn-watch:
    image: python:3.12-alpine@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d
    profiles: ["vpn-alerts"]
    container_name: vpn-watch
    depends_on:
      - gluetun
    networks: [media_net]
    environment:
      - VPN_WATCHDOG_ENABLED=${VPN_WATCHDOG_ENABLED:-false}
      - MQTT_HOST=${MQTT_HOST:-}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS=${MQTT_PASS:-}
      - MQTT_TOPIC=${MQTT_TOPIC:-home/media/vpn/status}
      - MQTT_TLS=${MQTT_TLS:-false}
      - PUID=${OWNER_UID}
      - PGID=${OWNER_GID}
    volumes:
      - ${SCRIPTS_HOME}:/app
    working_dir: /app
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        [ "$${VPN_WATCHDOG_ENABLED}" = "true" ] || exit 0
        pip install --no-cache-dir paho-mqtt==2.1.0 requests==2.34.2 &&
        exec python /app/vpn_watch.py
    restart: on-failure
